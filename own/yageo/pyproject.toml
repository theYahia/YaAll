[project]
name = "yageo"
version = "0.1.0"
description = "Open-source Claude Code skill для оптимизации сайтов под Яндекс ЭПОС + Alice AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "setuptools<75",          # pkg_resources required by pymorphy2 (natasha dep)
    "natasha>=1.6",
    "textstat>=0.7",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "ultimate-sitemap-parser>=0.5",
    "click>=8.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
pdf = ["reportlab>=4.0"]
# v0.2 — semantic similarity vs competitor corpus:
# llm = ["sentence-transformers>=3.0"]
# yandex = ["yandex-webmaster-api>=0.0.3", "yandex-cloud-ml-sdk"]

[project.scripts]
yageo-epos = "scripts.epos_scorer:main"
yageo-crawlers = "scripts.yandex_crawler_check:main"
yageo-content-depth = "scripts.content_depth:main"
yageo-schema = "scripts.json_ld_validator:main"
yageo-audit = "scripts.audit:main"
yageo-pdf = "scripts.generate_yageo_pdf:main"
yageo-batch = "scripts.batch_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "yageo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
